apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev # Dulezite, tady se specifikuje namespace !!!
resources:
  - ../../base
images:
  - name: dawiso-demo
    newTag: 1.2.0
replicas:
  - name: dawiso-demo-deployment
    count: 1
configMapGenerator:
  - name: dawiso-demo-configmap
    behavior: merge # Patch configu -> je to merge, takze jen to co je jinak zde oproti base se bere tady a zbytek z base
    literals:
      - Demo__Message=Ahoj z DEV v3